name: Update Scholar Feed

on:
  schedule:
    # 09:00 Asia/Kolkata (UTC has no daylight-saving shift in this region).
    - cron: "30 3 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scholar-feed
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          python -m pip install --disable-pip-version-check requests

      - name: Run script
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          python RSS.py

      - name: Commit updates
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add scholar_complete.json

          git diff --staged --quiet || git commit -m "Update Scholar Data"

          git push origin HEAD:${{ github.ref_name }}
